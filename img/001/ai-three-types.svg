<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 506" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6b85"/></marker>
  </defs>
  <rect width="1200" height="506" fill="#ffffff"/>

  <!-- 생성형 AI -->
  <g>
    <rect x="20" y="20" width="370" height="466" rx="18" fill="#f7f9fc" stroke="#d5dde9"/>
    <path d="M38 20H372A18 18 0 0 1 390 38V84H20V38A18 18 0 0 1 38 20Z" fill="#0a7fc2"/>
    <text x="205" y="62" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">생성형 AI</text>
    <text x="205" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#0a7fc2">만들어서 답한다</text>
    <g font-size="18" font-weight="600" fill="#16213a" text-anchor="middle">
      <rect x="60" y="136" width="290" height="50" rx="12" fill="#ffffff" stroke="#0a7fc2"/><text x="205" y="168">질문(프롬프트)</text>
      <rect x="60" y="216" width="290" height="50" rx="12" fill="#e6f2fa" stroke="#0a7fc2"/><text x="205" y="248">AI가 글 · 코드 · 이미지 생성</text>
      <rect x="60" y="296" width="290" height="50" rx="12" fill="#ffffff" stroke="#0a7fc2"/><text x="205" y="328">답변을 받는다</text>
    </g>
    <g stroke="#5d6b85" stroke-width="2.5" marker-end="url(#m)"><path d="M205 186V212"/><path d="M205 266V292"/></g>
    <!-- 언제 쓰나 -->
    <rect x="36" y="364" width="338" height="38" rx="10" fill="#e6f2fa"/>
    <rect x="44" y="371" width="40" height="24" rx="6" fill="#0a7fc2"/><text x="64" y="388" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">언제</text>
    <text class="when" x="92" y="388" font-size="14" font-weight="600" fill="#16213a">개념을 이해하려고 질문하고 답을 얻을 때</text>
    <text x="205" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#d9611f">사람: 받은 답을 직접 옮겨 쓴다</text>
    <text x="205" y="458" text-anchor="middle" font-size="15" fill="#5d6b85">ChatGPT · Claude · Gemini 채팅</text>
  </g>

  <!-- 에이전틱 AI -->
  <g>
    <rect x="415" y="20" width="370" height="466" rx="18" fill="#f7f9fc" stroke="#d5dde9"/>
    <path d="M433 20H767A18 18 0 0 1 785 38V84H415V38A18 18 0 0 1 433 20Z" fill="#1f9d63"/>
    <text x="600" y="62" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">에이전틱 AI</text>
    <text x="600" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#1f9d63">계획하고 일을 끝낸다</text>
    <g font-size="18" font-weight="600" fill="#16213a" text-anchor="middle">
      <rect x="455" y="136" width="290" height="50" rx="12" fill="#ffffff" stroke="#1f9d63"/><text x="600" y="168">목표와 규칙</text>
      <rect x="455" y="216" width="290" height="50" rx="12" fill="#e5f5ed" stroke="#1f9d63" stroke-dasharray="6 4"/><text x="600" y="248">계획 → 도구 사용 → 실행 ↻</text>
      <rect x="455" y="296" width="290" height="50" rx="12" fill="#ffffff" stroke="#1f9d63"/><text x="600" y="328">끝난 작업 · 고친 파일</text>
    </g>
    <g stroke="#5d6b85" stroke-width="2.5" marker-end="url(#m)"><path d="M600 186V212"/><path d="M600 266V292"/></g>
    <!-- 언제 쓰나 -->
    <rect x="431" y="364" width="338" height="38" rx="10" fill="#e5f5ed"/>
    <rect x="439" y="371" width="40" height="24" rx="6" fill="#1f9d63"/><text x="459" y="388" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">언제</text>
    <text class="when" x="487" y="388" font-size="14" font-weight="600" fill="#16213a">작업을 맡기고 결과물을 만들어야 할 때</text>
    <text x="600" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#d9611f">사람: 목표를 주고 결과를 검토한다</text>
    <text x="600" y="458" text-anchor="middle" font-size="15" fill="#5d6b85">Claude Code · Codex · Cursor 에이전트</text>
  </g>

  <!-- 피지컬 AI -->
  <g>
    <rect x="810" y="20" width="370" height="466" rx="18" fill="#f7f9fc" stroke="#d5dde9"/>
    <path d="M828 20H1162A18 18 0 0 1 1180 38V84H810V38A18 18 0 0 1 828 20Z" fill="#d9611f"/>
    <text x="995" y="62" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">피지컬 AI</text>
    <text x="995" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#d9611f">현실에서 움직인다</text>
    <g font-size="18" font-weight="600" fill="#16213a" text-anchor="middle">
      <rect x="850" y="136" width="290" height="50" rx="12" fill="#ffffff" stroke="#d9611f"/><text x="995" y="168">센서 · 카메라로 본다</text>
      <rect x="850" y="216" width="290" height="50" rx="12" fill="#fdeee6" stroke="#d9611f"/><text x="995" y="248">AI가 상황을 판단</text>
      <rect x="850" y="296" width="290" height="50" rx="12" fill="#ffffff" stroke="#d9611f"/><text x="995" y="328">로봇 몸이 움직인다</text>
    </g>
    <g stroke="#5d6b85" stroke-width="2.5" marker-end="url(#m)"><path d="M995 186V212"/><path d="M995 266V292"/></g>
    <!-- 언제 쓰나 -->
    <rect x="826" y="364" width="338" height="38" rx="10" fill="#fdeee6"/>
    <rect x="834" y="371" width="40" height="24" rx="6" fill="#d9611f"/><text x="854" y="388" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">언제</text>
    <text class="when" x="882" y="388" font-size="14" font-weight="600" fill="#16213a">현실의 물건을 옮기고 다루는 일을 맡길 때</text>
    <text x="995" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#d9611f">사람: 작업 환경과 안전을 관리한다</text>
    <text x="995" y="458" text-anchor="middle" font-size="15" fill="#5d6b85">자율주행차 · 휴머노이드 · 물류 로봇</text>
  </g>
</svg>
