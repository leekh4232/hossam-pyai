<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6b85"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a7fc2"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>

  <!-- 왼쪽: 채팅형 생성형 AI -->
  <rect x="20" y="16" width="560" height="508" rx="18" fill="#f3f6fb" stroke="#d5dde9"/>
  <text x="300" y="56" text-anchor="middle" font-size="24" font-weight="800" fill="#16213a">생성형 AI(채팅)로 코딩</text>
  <g font-size="19" font-weight="600">
    <rect x="100" y="84" width="400" height="52" rx="12" fill="#e6f2fa" stroke="#0a7fc2"/>
    <text x="300" y="117" text-anchor="middle" fill="#0a5f91">① 질문하고 코드 조각을 받는다</text>
    <rect x="100" y="160" width="400" height="52" rx="12" fill="#fdeee6" stroke="#d9611f"/>
    <text x="300" y="193" text-anchor="middle" fill="#a8461a">② 내 파일에 복사·붙여넣기</text>
    <rect x="100" y="236" width="400" height="52" rx="12" fill="#fdeee6" stroke="#d9611f"/>
    <text x="300" y="269" text-anchor="middle" fill="#a8461a">③ 직접 실행해 보고 에러 확인</text>
    <rect x="100" y="312" width="400" height="52" rx="12" fill="#fdeee6" stroke="#d9611f"/>
    <text x="300" y="345" text-anchor="middle" fill="#a8461a">④ 에러와 관련 코드를 다시 붙여넣기</text>
  </g>
  <g stroke="#5d6b85" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M300 136V156"/><path d="M300 212V232"/><path d="M300 288V308"/>
    <path d="M100 338H62V110H96"/>
  </g>
  <text x="300" y="404" text-anchor="middle" font-size="17" fill="#5d6b85">맞을 때까지 ①~④를 사람이 계속 반복</text>
  <g font-size="17">
    <circle cx="70" cy="452" r="7" fill="#d9611f"/><text x="86" y="458" fill="#16213a">주황 = 사람이 하는 일</text>
    <circle cx="300" cy="452" r="7" fill="#0a7fc2"/><text x="316" y="458" fill="#16213a">파랑 = AI가 하는 일</text>
  </g>
  <text x="300" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#c8323f">AI는 내 프로젝트를 보지 못하고, 옮기는 일은 전부 사람 몫</text>

  <!-- 오른쪽: 에이전틱 AI -->
  <rect x="620" y="16" width="560" height="508" rx="18" fill="#f3f6fb" stroke="#d5dde9"/>
  <text x="900" y="56" text-anchor="middle" font-size="24" font-weight="800" fill="#16213a">에이전틱 AI로 코딩</text>
  <g font-size="19" font-weight="600">
    <rect x="700" y="84" width="400" height="52" rx="12" fill="#fdeee6" stroke="#d9611f"/>
    <text x="900" y="117" text-anchor="middle" fill="#a8461a">목표와 규칙을 준다 (CLAUDE.md)</text>
  </g>
  <rect x="660" y="160" width="480" height="232" rx="16" fill="#ffffff" stroke="#0a7fc2" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="900" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#0a7fc2">AI가 스스로 반복</text>
  <g font-size="18" font-weight="600">
    <rect x="690" y="204" width="190" height="56" rx="12" fill="#e6f2fa" stroke="#0a7fc2"/>
    <text x="785" y="238" text-anchor="middle" fill="#0a5f91">계획 세우기</text>
    <rect x="920" y="204" width="190" height="56" rx="12" fill="#e6f2fa" stroke="#0a7fc2"/>
    <text x="1015" y="238" text-anchor="middle" fill="#0a5f91">파일 읽고 고치기</text>
    <rect x="920" y="312" width="190" height="56" rx="12" fill="#e6f2fa" stroke="#0a7fc2"/>
    <text x="1015" y="346" text-anchor="middle" fill="#0a5f91">실행·테스트</text>
    <rect x="690" y="312" width="190" height="56" rx="12" fill="#e6f2fa" stroke="#0a7fc2"/>
    <text x="785" y="346" text-anchor="middle" fill="#0a5f91">결과 확인</text>
  </g>
  <g stroke="#0a7fc2" stroke-width="2.5" fill="none" marker-end="url(#b)">
    <path d="M880 232H916"/><path d="M1015 260V308"/><path d="M920 340H884"/><path d="M785 312V264"/>
  </g>
  <g stroke="#5d6b85" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M900 136V156"/><path d="M900 392V412"/>
  </g>
  <g font-size="19" font-weight="600">
    <rect x="700" y="416" width="400" height="52" rx="12" fill="#fdeee6" stroke="#d9611f"/>
    <text x="900" y="449" text-anchor="middle" fill="#a8461a">바뀐 내용(diff)을 검토하고 승인</text>
  </g>
  <text x="900" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#1f9d63">사람은 방향을 정하고 결과를 판단하는 데 집중</text>
</svg>
